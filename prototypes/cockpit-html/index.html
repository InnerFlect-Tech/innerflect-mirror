<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Innerflect Mirror — Cockpit</title>
  <style>
    :root {
      --ink:#eef3f1; --muted:#788581; --quiet:#4f5e5a;
      --canvas:#050a0a; --rail:#060c0c; --surface:#09100f;
      --line:#172725; --line-strong:#263a36; --teal:#55cbbb;
      --teal-soft:#8abbb3; --critical:#e16d5d;
      --rail-w:280px; --top-h:82px; --pad:clamp(18px,2vw,34px);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,a{font:inherit} button{color:inherit}
    :focus-visible{outline:2px solid var(--teal);outline-offset:3px}
    .cockpit{width:100vw;height:100dvh;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,1fr);overflow:hidden;background:var(--canvas)}
    .rail{grid-row:1/-1;min-height:0;position:relative;border-right:1px solid var(--line);background:linear-gradient(180deg,#07100f 0%,#050a0a 72%);display:grid;grid-template-rows:var(--top-h) minmax(0,1fr) auto;padding:0 20px;transition:padding 220ms ease}
    .brand{height:var(--top-h);display:flex;align-items:center;gap:13px;border-bottom:1px solid transparent;white-space:nowrap}
    .brand-mark{width:24px;height:32px;display:block;flex:0 0 auto}
    .brand-name{font-size:21px;letter-spacing:-.025em;font-weight:650}.brand-divider{height:20px;width:1px;background:#33423f}.brand-product{font-size:14px;letter-spacing:.12em;color:var(--teal-soft);text-transform:uppercase}
    .nav{align-self:start;display:grid;gap:7px;padding-top:62px}
    .nav button{height:48px;width:100%;position:relative;border:1px solid transparent;border-radius:7px;background:transparent;color:#687672;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:12px;padding:0 14px;text-align:left;cursor:pointer;transition:color 160ms,border-color 160ms,background 160ms}
    .nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}.nav button:hover{color:#aab6b2;background:#0a1312}.nav button.active{color:#dce9e5;border-color:#31766e;background:linear-gradient(90deg,rgba(85,203,187,.12),rgba(85,203,187,.03));box-shadow:inset 3px 0 var(--teal)}
    .nav .count{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#6e312c;color:#ffd4cd;font-size:12px;font-weight:650}
    .rail-collapse{position:absolute;z-index:4;right:-12px;top:calc(var(--top-h) + 22px);width:24px;height:24px;padding:0;border-radius:50%;border:1px solid #29403c;background:#091211;color:#63736e;display:grid;place-items:center;cursor:pointer;transition:color 160ms,border-color 160ms,transform 220ms}.rail-collapse:hover{color:var(--teal);border-color:#3a6b64}.rail-collapse svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
    .rail-bottom{padding:22px 0 max(18px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:30px}
    .tagline{margin:0 12px;color:#52615d;font-size:12px;line-height:1.55;max-width:160px}
    .operator{display:grid;grid-template-columns:38px minmax(0,1fr) 30px;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid #31554f;background:#11201e;color:#a9d7cf;font-size:13px}.operator b,.operator small{display:block}.operator b{font-size:13px}.operator small{margin-top:2px;color:#65736f;font-size:11px}.tune{width:30px;height:30px;padding:0;border:0;border-radius:5px;background:none;color:#64726f;display:grid;place-items:center;cursor:pointer}.tune:hover{color:#a9b6b2;background:#0d1715}.tune svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
    .topbar{grid-column:2;min-width:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(210px,1fr) minmax(320px,460px) minmax(210px,1fr);align-items:center;gap:20px;padding:0 var(--pad);background:rgba(5,11,10,.92)}
    .health{justify-self:start;display:flex;align-items:center;gap:10px;color:#8aa09a;font-size:13px}.health i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px rgba(85,203,187,.55)}
    .command{height:42px;border:1px solid var(--line-strong);border-radius:7px;background:#08100f;color:#667470;display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 12px;cursor:pointer;text-align:left}.command:hover{border-color:#37504b;color:#99a6a2}.command svg{width:17px;height:17px;stroke:currentColor;fill:none}.command kbd{border:1px solid #2e3e3a;border-radius:4px;padding:3px 6px;color:#71807b;background:#0b1413;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
    .meta{justify-self:end;display:flex;align-items:center;gap:14px;color:#66736f;font-size:12px}.mode-switch{display:flex;padding:3px;border:1px solid #22332f;border-radius:6px;background:#07100f}.mode-switch button{height:27px;padding:0 9px;border:0;border-radius:3px;background:transparent;color:#5e6d69;font-size:9px;cursor:pointer}.mode-switch button.active{background:#142420;color:#bde0da}.bell{position:relative;border:0;background:none;color:#71807b;padding:6px;cursor:pointer}.bell svg{width:18px;height:18px;stroke:currentColor;fill:none}.bell i{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:#d8a34d}
    .stage{grid-column:2;min-width:0;min-height:0;position:relative;overflow:hidden;background:radial-gradient(ellipse 55% 45% at 52% 48%,rgba(30,87,79,.06),transparent 72%),linear-gradient(180deg,#07100f,#050a0a)}
    .stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(85,203,187,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(85,203,187,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,#000 0%,transparent 68%);pointer-events:none}
    .stage-frame{position:absolute;inset:var(--pad);border:1px solid rgba(79,111,104,.18);border-radius:10px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:rgba(6,13,12,.38)}
    .stage-frame::before,.stage-frame::after{content:"";position:absolute;width:34px;height:34px;border-color:#29423d;opacity:.55}.stage-frame::before{left:-1px;top:-1px;border-left:1px solid;border-top:1px solid}.stage-frame::after{right:-1px;bottom:-1px;border-right:1px solid;border-bottom:1px solid}
    .workspace-head{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;padding:clamp(18px,2.2vw,30px);border-bottom:1px solid var(--line)}.workspace-title{min-width:0}.workspace-title small{display:block;margin-bottom:7px;color:#5f706b;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.workspace-title h1{margin:0;font-size:clamp(24px,2.6vw,38px);font-weight:520;letter-spacing:-.035em}.workspace-title p{margin:7px 0 0;color:#64736f;font-size:12px;line-height:1.4}.semantic-path{display:flex;align-items:center;gap:7px;margin-bottom:8px;color:#44534f;font-size:9px}.semantic-path b{color:#75968f;font-weight:500}.semantic-path i{width:12px;height:1px;background:#2b403b}.domains{display:flex;align-items:center;gap:5px;padding:4px;border:1px solid #22332f;border-radius:7px;background:#07100f}.domains button{height:30px;padding:0 11px;border:0;border-radius:4px;background:transparent;color:#60706b;font-size:10px;cursor:pointer}.domains button:hover{color:#abb8b4}.domains button.active{background:#13231f;color:#b9ddd6;box-shadow:inset 0 0 0 1px #29463f}
    .board{min-width:0;min-height:0;padding:clamp(12px,1.6vw,22px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
    .board.is-world{display:block;padding:clamp(10px,1.25vw,18px)}.company-world{width:100%;height:100%;position:relative;overflow:hidden;border:1px solid #1d312d;border-radius:8px;background:radial-gradient(circle at 50% 48%,rgba(33,118,105,.13),transparent 34%),linear-gradient(180deg,#071211,#050b0a)}.company-world canvas{display:block;width:100%;height:100%;touch-action:none}.world-loading{position:absolute;inset:0;display:grid;place-items:center;color:#52635e;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.world-caption{position:absolute;left:16px;top:14px;display:grid;gap:3px;pointer-events:none}.world-caption b{font-size:11px;font-weight:540;color:#a6bab5}.world-caption span{font-size:9px;color:#4f625d}.world-legend{position:absolute;right:14px;bottom:12px;display:flex;gap:13px;padding:7px 9px;border:1px solid #1d312d;border-radius:5px;background:rgba(5,12,11,.78);color:#596a65;font-size:8px;pointer-events:none}.world-legend i{display:inline-block;width:5px;height:5px;margin-right:5px;border-radius:50%;background:#66736f}.world-legend span:last-child i{background:var(--teal);box-shadow:0 0 6px var(--teal)}.world-domain{position:absolute;z-index:3;transform:translate(-50%,-50%);padding:5px 7px;border:1px solid #24433e;border-radius:4px;background:rgba(5,13,12,.76);backdrop-filter:blur(6px);color:#a6b6b2;font-size:9px;pointer-events:none}.world-domain small{display:block;margin-top:2px;color:#4f6862;font-size:7px}.world-domain[data-slot="0"]{left:25%;top:24%}.world-domain[data-slot="1"]{left:75%;top:24%}.world-domain[data-slot="2"]{left:22%;top:70%}.world-domain[data-slot="3"]{left:78%;top:70%}.world-domain[data-slot="4"]{left:50%;top:83%}.world-domain[data-slot="5"]{left:50%;top:15%}
    .module{min-width:0;min-height:0;position:relative;border:1px solid #21332f;border-radius:8px;background:linear-gradient(145deg,rgba(13,24,22,.92),rgba(7,14,13,.92));padding:clamp(14px,1.5vw,22px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;cursor:grab;overflow:hidden;transition:border-color 160ms,background 160ms,transform 160ms}.module:hover{border-color:#36544e;background:linear-gradient(145deg,rgba(16,30,27,.96),rgba(8,16,15,.96))}.module:active{cursor:grabbing}.module::after{content:"⠿";position:absolute;right:13px;top:10px;color:#3d4e49;font-size:15px;letter-spacing:-2px}.module-index{font-size:9px;color:#4c5b57;letter-spacing:.12em}.module h2{align-self:center;margin:8px 0;font-size:clamp(15px,1.25vw,19px);font-weight:540;letter-spacing:-.018em}.module p{margin:0;padding-right:12px;color:#667570;font-size:clamp(9px,.78vw,11px);line-height:1.5}.module-meta{align-self:end;display:flex;justify-content:space-between;gap:8px;padding-top:10px;color:#42504c;font-size:9px}.module-meta b{font-weight:500;color:#63847e}.domain-toggle{position:absolute;right:12px;bottom:12px;height:26px;padding:0 9px;border:1px solid #2a3c38;border-radius:4px;background:#0a1312;color:#687873;font-size:9px;cursor:pointer}.module.is-enabled{border-color:#32655d;background:linear-gradient(145deg,rgba(18,40,35,.96),rgba(7,16,14,.96))}.module.is-enabled .domain-toggle{border-color:#3c756c;background:#16342e;color:#a8d8cf}.module.is-disabled{opacity:.62}.sortable-ghost{opacity:.22}.sortable-chosen{border-color:#49857b;transform:scale(.985)}
    .viewport-note{position:absolute;left:calc(var(--pad) + 14px);bottom:calc(var(--pad) + 12px);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#34413e}
    .cockpit.is-compact{--rail-w:78px}.cockpit.is-compact .rail{padding-inline:12px}.cockpit.is-compact .brand{justify-content:center}.cockpit.is-compact .brand-name,.cockpit.is-compact .brand-divider,.cockpit.is-compact .brand-product,.cockpit.is-compact .nav button>span,.cockpit.is-compact .nav .count,.cockpit.is-compact .tagline,.cockpit.is-compact .operator>div,.cockpit.is-compact .tune{display:none}.cockpit.is-compact .nav button{grid-template-columns:1fr;padding:0;place-items:center}.cockpit.is-compact .operator{display:flex;justify-content:center}.cockpit.is-compact .rail-collapse{transform:rotate(180deg)}
    .cockpit.is-compact .nav button::after{content:attr(data-label);position:absolute;left:56px;top:50%;transform:translateY(-50%) translateX(-4px);padding:7px 9px;border:1px solid #2a3b37;border-radius:5px;background:#0a1211;color:#c3cfcb;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 140ms,transform 140ms;box-shadow:0 8px 24px rgba(0,0,0,.35)}.cockpit.is-compact .nav button:hover::after,.cockpit.is-compact .nav button:focus-visible::after{opacity:1;transform:translateY(-50%) translateX(0)}
    @media(max-height:720px){:root{--top-h:66px;--rail-w:248px}.nav{padding-top:24px;gap:3px}.nav button{height:42px}.tagline{display:none}.rail-bottom{padding-top:14px;gap:0}.workspace-head{padding:13px 18px}.workspace-title small{margin-bottom:3px}.workspace-title p{margin-top:3px}.board{padding:10px}.module{padding:12px}.module p{line-height:1.35}}
    @media(max-width:920px){:root{--rail-w:76px}.rail{padding:0 12px}.brand{justify-content:center}.brand-name,.brand-divider,.brand-product,.nav span,.nav .count,.tagline,.operator>div,.tune{display:none}.nav button{grid-template-columns:1fr;padding:0;place-items:center}.operator{display:flex;justify-content:center}.topbar{grid-template-columns:1fr auto}.command{display:none}.workspace-head{grid-template-columns:1fr;align-items:start;gap:12px}.domains{justify-self:start}.board{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}}
    @media(max-width:560px){:root{--rail-w:64px;--top-h:62px}.rail{display:grid;padding-inline:8px}.brand{justify-content:center}.brand-mark{width:21px}.brand-name,.brand-divider,.brand-product,.nav button>span,.nav .count,.tagline,.operator>div,.tune,.rail-collapse{display:none}.nav{padding-top:18px;gap:4px}.nav button{height:44px;grid-template-columns:1fr;padding:0;place-items:center;border-radius:6px}.nav button::after{content:attr(data-label);position:absolute;left:51px;top:50%;z-index:8;transform:translateY(-50%) translateX(-4px);padding:7px 9px;border:1px solid #2a3b37;border-radius:5px;background:#0a1211;color:#c3cfcb;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 140ms,transform 140ms;box-shadow:0 8px 24px rgba(0,0,0,.35)}.nav button:hover::after,.nav button:focus-visible::after{opacity:1;transform:translateY(-50%)}.operator{display:flex;justify-content:center}.avatar{width:36px;height:36px}.topbar{grid-column:2;padding:0 12px;grid-template-columns:minmax(0,1fr) auto;gap:8px}.health{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage{grid-column:2}.meta{gap:0}.meta>span,.mode-switch{display:none}.stage-frame{inset:7px}.workspace-head{padding:11px 10px;gap:8px}.workspace-title small,.workspace-title p,.semantic-path{display:none}.workspace-title h1{font-size:20px}.domains{width:100%;overflow:hidden}.domains button{min-width:0;flex:1;padding:0 4px;font-size:8px}.board{padding:7px;gap:6px}.module{padding:9px;border-radius:6px}.module::after{right:8px;top:5px}.module-index{font-size:7px}.module h2{font-size:12px;margin:4px 0}.module p{font-size:8px;line-height:1.25}.module-meta{font-size:7px;padding-top:4px}.world-caption,.world-legend{display:none}.world-domain{font-size:7px;padding:3px 4px}.world-domain small{display:none}.viewport-note{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    .function-dock{position:absolute;z-index:5;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:5px;max-width:min(62%,560px)}.function-dock button{height:27px;padding:0 9px;border:1px solid #20332f;border-radius:5px;background:rgba(6,14,13,.86);color:#53635f;font-size:8px;cursor:pointer;backdrop-filter:blur(7px)}.function-dock button:hover{border-color:#3a5e57;color:#91aaa4}.function-dock button.active{border-color:#327168;background:rgba(17,49,43,.88);color:#b5ddd5}.function-dock button.active::before{content:"";display:inline-block;width:5px;height:5px;margin-right:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal)}
    @media(max-width:560px){.function-dock{left:7px;right:7px;bottom:7px;max-width:none}.function-dock button{height:24px;padding:0 6px;font-size:7px}}
    .board:not(.is-world){grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}.module[data-size="hero"]{grid-column:span 8;grid-row:span 5}.module[data-size="side"]{grid-column:span 4;grid-row:span 5}.module[data-size="wide"]{grid-column:span 6;grid-row:span 3}.module[data-size="third"]{grid-column:span 4;grid-row:span 3}.module[data-size="tall"]{grid-column:span 4;grid-row:span 8}.module[data-size="main"]{grid-column:span 8;grid-row:span 8}.module[data-size="half"]{grid-column:span 6;grid-row:span 4}.module[data-size="full"]{grid-column:span 12;grid-row:span 3}.module-feature{align-self:center;display:grid;gap:10px}.module-feature strong{font-size:clamp(25px,3vw,50px);font-weight:430;letter-spacing:-.05em;color:#d9e5e1}.module-feature .track{height:2px;background:#1b302c;overflow:hidden}.module-feature .track i{display:block;width:68%;height:100%;background:var(--teal);box-shadow:0 0 10px rgba(85,203,187,.45)}.module[data-size="hero"]{background:radial-gradient(circle at 68% 48%,rgba(42,133,119,.13),transparent 34%),linear-gradient(145deg,rgba(13,24,22,.92),rgba(7,14,13,.92))}.module[data-size="hero"] h2,.module[data-size="main"] h2{font-size:clamp(20px,2vw,30px)}

    @media(max-width:560px){.board:not(.is-world){grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}.module[data-size]{grid-column:span 1;grid-row:span 2}.module[data-size="hero"],.module[data-size="main"],.module[data-size="full"]{grid-column:span 2;grid-row:span 4}.module[data-size="tall"],.module[data-size="side"]{grid-row:span 4}.module-feature strong{font-size:22px}}

<body>
  <main class="cockpit">
    <aside class="rail" aria-label="Innerflect navigation">
      <div class="brand" aria-label="Innerflect Mirror">
        <svg class="brand-mark" viewBox="0 0 24 32" aria-hidden="true"><g fill="none" stroke="#55cbbb" stroke-width="2.25" stroke-linecap="round"><path d="M3 12v8"/><path d="M8 6v20"/><path d="M13 2v28"/><path d="M18 8v16"/><path d="M23 11v10"/></g></svg>
        <span class="brand-name">Innerflect</span><i class="brand-divider"></i><span class="brand-product">Mirror</span>
      </div>
      <nav class="nav">
        <button class="active" aria-current="page" aria-label="Company" data-label="Company" data-status="One domain is at risk"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg><span>Company</span></button>
        <button aria-label="Work" data-label="Work" data-status="Work is flowing normally"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M6.5 10v4a3 3 0 0 0 3 3H14"/></svg><span>Work</span></button>
        <button aria-label="Decisions, 3 waiting" data-label="Decisions" data-status="3 decisions need you"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h5M9 14l2 2 4-5"/></svg><span>Decisions</span><i class="count">3</i></button>
        <button aria-label="Knowledge" data-label="Knowledge" data-status="Knowledge is current"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22z"/></svg><span>Knowledge</span></button>
        <button aria-label="Impact" data-label="Impact" data-status="Impact is verified"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Impact</span></button>
      </nav>
      <button class="rail-collapse" aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 16 16"><path d="m10 3-5 5 5 5"/></svg></button>
      <div class="rail-bottom"><p class="tagline">A more capable company, by design.</p><div class="operator"><span class="avatar">IF</span><div><b>Indias</b><small>Company owner</small></div><button class="tune" id="settings-button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div></div>
    </aside>
    <header class="topbar">
      <output class="health" aria-live="polite"><i></i>System live · 4 domains connected</output>
      <button class="command"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>Ask anything about the company</span><kbd>⌘ K</kbd></button>
      <div class="meta"><div class="mode-switch" aria-label="Company mode"><button class="active">Mirror</button><button>Builder</button></div><button class="bell" aria-label="Notifications, one unread"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i></i></button><span>Sunday · 09:41</span></div>
    </header>
    <section class="stage" aria-label="Product architecture workspace">
      <div class="stage-frame">
        <header class="workspace-head"><div class="workspace-title"><div class="semantic-path" id="semantic-path"><b>Company</b><i></i><span>All active functions</span></div><small id="surface-type">Stable product surface</small><h1 id="section-name">Company</h1><p id="section-note">The current state of the organisation, across every active function.</p></div><div class="domains" id="domains" aria-label="Filter by company function"></div></header>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script>
    const cockpit=document.querySelector('.cockpit');
    const collapse=document.querySelector('.rail-collapse');
    collapse.addEventListener('click',()=>{const compact=cockpit.classList.toggle('is-compact');collapse.setAttribute('aria-expanded',String(!compact));collapse.setAttribute('aria-label',compact?'Expand sidebar':'Collapse sidebar')});
    const sectionName=document.querySelector('#section-name');

    const semanticPath=document.querySelector('#semantic-path span');

    const companyFunctions=[
      {name:'Marketing',description:'Demand, audience, content and campaigns.',enabled:true},
      {name:'Sales',description:'Leads, qualification, proposals and revenue.',enabled:true},
      {name:'Delivery',description:'Projects, fulfilment, quality and customers.',enabled:true},
      {name:'Finance',description:'Invoices, payments, reconciliation and reporting.',enabled:true},
      {name:'People',description:'Hiring, onboarding, development and capacity.',enabled:false},
      {name:'Operations',description:'Suppliers, assets, internal service and controls.',enabled:false}

    const pages={
      Company:{note:'Choose the functions this company has. They determine what the rest of Mirror can show and manage.',modules:[]},
      Work:{note:'See work as a system: its shape, live movement and points of intervention.',modules:[['Operating flow','Trigger → context → work → decision → action → verification → outcome.','hero'],['Live now','47 executions moving; 3 require attention.','side'],['Workflow builder','Dismantle the selected workflow and change each semantic part.','wide'],['Actors and exceptions','Humans, agents, systems and blocked work in one operational view.','wide']]},
      Decisions:{note:'A deliberately small human authority surface, with the context to intervene well.',modules:[['Needs you','Three decisions are outside autonomous authority.','main'],['Your authority','Limits, ownership and escalation destinations.','tall'],['Patterns becoming policy','Repeated judgement ready to become an explicit rule.','third'],['Decision history','Comparable evidence, choices and verified outcomes.','third']]},
      Knowledge:{note:'The company’s usable memory: connected, trusted and visible where it changes work.',modules:[['Knowledge graph','Policies, customer context, observed behaviour and outcomes connected to the work that uses them.','hero'],['Ask the company','Grounded answers with sources, confidence and contradictions.','side'],['Trust and freshness','Ownership, age, conflicts and verification state.','third'],['Learning queue','New observations waiting to become trusted memory.','third'],['Documented vs observed','Where real operating behaviour differs from written procedure.','third']]},
      Impact:{note:'Verified value, traced from company outcome back to operational cause.',modules:[['Autonomy over time','Earned autonomy increased from 47% to 68%, with every change linked to evidence.','hero'],['Verified outcomes','99.7% verified · zero unsafe autonomous actions.','side'],['Human capacity','32 hours returned to the team this week.','third'],['Financial effect','€12,480 protected or created by verified actions.','third'],['Trace explorer','Outcome → action → decision → policy → evidence → event.','third']]},
      Settings:{note:'The machine-readable constitution defining what the system may know and do.',modules:[['Company constitution','Active functions, owners and the operating boundaries inherited across Mirror.','main'],['Authority boundaries','Scope, financial and risk limits, reversibility and escalation.','tall'],['Systems and access','Observed and operated systems with explicit permissions.','half'],['Knowledge scope','Included sources, deliberate exclusions, retention and audit.','half']]}
    };
    let activePage='Company',activeDomain='All company',sortable;
    function renderDomains(){const active=companyFunctions.filter(item=>item.enabled);if(activeDomain!=='All company'&&!active.some(item=>item.name===activeDomain))activeDomain='All company';domainBar.innerHTML=[`<button class="${activeDomain==='All company'?'active':''}" data-domain="All company">All</button>`,...active.map(item=>`<button class="${activeDomain===item.name?'active':''}" data-domain="${item.name}">${item.name}</button>`)].join('');domainBar.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{activeDomain=button.dataset.domain;render()}))}
    function render(){renderDomains();const page=pages[activePage];sectionName.textContent=activePage;sectionNote.textContent=page.note;surfaceType.textContent=activePage==='Company'?'Living company model':'Stable product surface';semanticPath.textContent=activePage==='Company'?'Active operating system':`${activeDomain} / ${activePage}`;if(sortable){sortable.destroy();sortable=null}if(activePage==='Company'){board.classList.add('is-world');const enabled=companyFunctions.filter(item=>item.enabled);board.innerHTML=`<section class="company-world" id="company-world" aria-label="Interactive 3D model of the company"><div class="world-loading">Assembling company model</div><div class="world-caption"><b>Your company, as a living system</b><span>Move to inspect · active functions define every surface</span></div>${enabled.map((item,i)=>`<div class="world-domain" data-slot="${i}">${item.name}<small>active function</small></div>`).join('')}<div class="function-dock" aria-label="Company functions">${companyFunctions.map((item,i)=>`<button class="${item.enabled?'active':''}" data-index="${i}" aria-pressed="${item.enabled}">${item.name}</button>`).join('')}</div><div class="world-legend"><span><i></i>Human authority</span><span><i></i>Autonomous system</span></div></section>`;board.querySelectorAll('.function-dock button').forEach(button=>button.addEventListener('click',()=>{const item=companyFunctions[Number(button.dataset.index)];item.enabled=!item.enabled;render()}));window.mountCompanyWorld?.(document.querySelector('#company-world'),enabled);return}window.destroyCompanyWorld?.();board.classList.remove('is-world');board.dataset.layout=activePage.toLowerCase();board.innerHTML=page.modules.map((m,i)=>`<article class="module" data-size="${m[2]}" data-id="${activePage}-${i}"><span class="module-index">${activePage==='Work'&&i===0?'CANONICAL FLOW':activePage==='Decisions'&&i===0?'HUMAN AUTHORITY':activePage==='Impact'&&i===0?'VERIFIED CHANGE':String(i+1).padStart(2,'0')}</span><div class="module-feature"><h2>${m[0]}</h2><p>${m[1]}</p>${i===0&&activePage==='Impact'?'<strong>47% → 68%</strong><span class="track"><i></i></span>':''}</div><span class="module-meta"><b>${activeDomain}</b><span>Drag to reposition</span></span></article>`).join('');if(window.Sortable)sortable=new Sortable(board,{animation:180,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',delay:80,delayOnTouchOnly:true,touchStartThreshold:4})}
    document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(item=>{item.classList.remove('active');item.removeAttribute('aria-current')});button.classList.add('active');button.setAttribute('aria-current','page');activePage=button.dataset.label;render()}));
    document.querySelector('#settings-button').addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(item=>{item.classList.remove('active');item.removeAttribute('aria-current')});activePage='Settings';render()});
    document.querySelectorAll('.mode-switch button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.mode-switch button').forEach(item=>item.classList.remove('active'));button.classList.add('active')}));
    render();
  </script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    const ASSETS=location.port==='4178'?'http://127.0.0.1:4180/public/models/innerflect-v2/':'/models/innerflect-v2/';
    const loader=new GLTFLoader();let teardown=()=>{};
    const load=id=>new Promise((ok,no)=>loader.load(`${ASSETS}${id}.glb`,g=>ok(g.scene),undefined,no));
    const skin=name=>{const n=(name||'').toLowerCase();if(n.includes('teal'))return new THREE.MeshStandardMaterial({color:0x299d90,metalness:.38,roughness:.24,emissive:0x0a4941,emissiveIntensity:.55});if(n.includes('amber'))return new THREE.MeshStandardMaterial({color:0xc28a39,metalness:.4,roughness:.3,emissive:0x512a08,emissiveIntensity:.45});if(n.includes('risk'))return new THREE.MeshStandardMaterial({color:0xa65d47,emissive:0x37120b,emissiveIntensity:.4,transparent:true,opacity:.78});if(n.includes('human'))return new THREE.MeshStandardMaterial({color:0x929b99,metalness:.18,roughness:.42});if(n.includes('glass'))return new THREE.MeshPhysicalMaterial({color:0x74b7ad,roughness:.12,clearcoat:1,transparent:true,opacity:.34,depthWrite:false});if(n.includes('warm'))return new THREE.MeshStandardMaterial({color:0xd6ddda,metalness:.15,roughness:.3});return new THREE.MeshStandardMaterial({color:n.includes('light')?0x34423f:0x17211f,metalness:.52,roughness:.32})};
    const prep=(root,scale)=>{root.scale.setScalar(scale);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.material=skin(o.material?.name)}});return root};
    window.destroyCompanyWorld=()=>{teardown();teardown=()=>{}};
    window.mountCompanyWorld=async(container,functions)=>{window.destroyCompanyWorld();if(!container)return;const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050a09,.045);const camera=new THREE.OrthographicCamera(-7,7,4.2,-4.2,.1,100);camera.position.set(8,8,10);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.AgXToneMapping;renderer.toneMappingExposure=.9;renderer.shadowMap.enabled=true;container.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xb9d8d2,0x06100e,2.1));const key=new THREE.DirectionalLight(0xb8fff4,3.1);key.position.set(5,9,7);key.castShadow=true;scene.add(key);const rim=new THREE.PointLight(0x27c9b5,24,14);rim.position.set(-3,2,-2);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(7.2,64),new THREE.MeshStandardMaterial({color:0x07100f,roughness:.72,transparent:true,opacity:.68}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.35;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(15,30,0x17433d,0x0d2420);grid.position.y=-1.32;grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);const world=new THREE.Group();world.rotation.x=-.04;scene.add(world);let dead=false,frame=0,core;
      try{const ids=['company-core','domain-platform','human-glyph','agent-glyph','tool-glyph','knowledge-object','decision-gate','risk-hotspot'];const [coreSrc,platform,...glyphs]=await Promise.all(ids.map(load));if(dead)return;core=prep(coreSrc,1.05);core.position.y=-.25;world.add(core);const slots=[[-3.2,.1,-1.7],[3.2,.1,-1.7],[-3.35,.05,2],[3.35,.05,2],[0,.05,3.3],[0,.05,-3.1]];functions.forEach((fn,i)=>{const p=prep(platform.clone(true),.78);p.position.set(...slots[i]);world.add(p);const glyph=prep(glyphs[i%glyphs.length].clone(true),.52);glyph.position.set(slots[i][0],slots[i][1]+.72,slots[i][2]);world.add(glyph);const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,-.3,0),new THREE.Vector3(slots[i][0]*.48,-.55,slots[i][2]*.48),new THREE.Vector3(slots[i][0],-.72,slots[i][2])]);world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(28)),new THREE.LineBasicMaterial({color:0x43c8b6,transparent:true,opacity:.58})))});container.querySelector('.world-loading')?.remove()}catch(e){const l=container.querySelector('.world-loading');if(l)l.textContent='3D assets unavailable';console.error(e)}
      const resize=()=>{const w=container.clientWidth,h=container.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);const a=w/h;camera.left=-4.4*a;camera.right=4.4*a;camera.top=4.4;camera.bottom=-4.4;camera.updateProjectionMatrix()};const observer=new ResizeObserver(resize);observer.observe(container);resize();let tx=0,ty=0;const pointer=e=>{const r=container.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*.13;ty=((e.clientY-r.top)/r.height-.5)*.08};container.addEventListener('pointermove',pointer);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const animate=t=>{if(dead)return;world.rotation.y+=(tx-world.rotation.y)*.035;world.rotation.x+=(-.04-ty-world.rotation.x)*.035;if(core&&!reduced)core.position.y=-.25+Math.sin(t*.0012)*.045;renderer.render(scene,camera);frame=requestAnimationFrame(animate)};frame=requestAnimationFrame(animate);teardown=()=>{dead=true;cancelAnimationFrame(frame);observer.disconnect();container.removeEventListener('pointermove',pointer);renderer.dispose();renderer.domElement.remove();scene.traverse(o=>{o.geometry?.dispose?.();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose?.());else o.material?.dispose?.()})}};
    if(document.querySelector('#company-world'))window.mountCompanyWorld(document.querySelector('#company-world'),companyFunctions.filter(item=>item.enabled));
  </script>
